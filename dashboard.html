<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東信行 — 工程項目管理總覽</title>
<style>
:root {
  --bg0: #e8eef2; --bg1: #f3f6f8;
  --surface: #ffffff; --surface-2: #f7f9fb;
  --text: #1a2b33; --text-muted: #5c7380; --text-light: #8aa0ad;
  --teal: #1F4E5F; --teal-soft: #d5e4ea; --teal-mid: #2a6578;
  --coral: #EE8A6A; --coral-soft: #fde8e0; --coral-deep: #e07555;
  --green: #2f9e6b; --green-soft: #dff5eb;
  --amber: #d97706; --amber-soft: #fef3c7;
  --red: #c94444; --red-soft: #fde8e8;
  --grey: #94a3b8; --grey-soft: #eef2f5;
  --purple: #6b5b95; --purple-soft: #ebe7f5;
  --radius: 22px; --radius-sm: 14px;
  --shadow: 0 2px 8px rgba(31,78,95,.06), 0 1px 2px rgba(31,78,95,.04);
  --shadow-lg: 0 12px 32px rgba(31,78,95,.10);
  --gap: 18px; /* single gutters between all bento cards */
  --font: "Noto Sans CJK HK", "Noto Sans CJK TC", "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); color: var(--text); font-size: 15px; line-height: 1.55;
  min-height: 100vh;
  background: linear-gradient(160deg, #dfe8ee 0%, #eef3f6 40%, #f5f7f9 100%);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { color: var(--teal-mid); text-decoration: none; }
.app { max-width: 1440px; margin: 0 auto; padding: 28px 28px 64px; }

/* Topbar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-logo {
  width: 48px; height: 48px; border-radius: 16px;
  background: linear-gradient(145deg, var(--teal), var(--teal-mid));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; box-shadow: var(--shadow);
}
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--teal); }
.brand .sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.view-tabs {
  display: flex; background: rgba(255,255,255,.75); backdrop-filter: blur(8px);
  border: 1px solid rgba(31,78,95,.08); border-radius: 999px; padding: 4px; gap: 2px;
  box-shadow: var(--shadow);
}
.view-tab { padding: 9px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text-muted); transition: .15s; }
.view-tab.active { background: var(--teal); color: #fff; }
.view-tab:hover:not(.active) { background: var(--grey-soft); color: var(--text); }
.demo-controls { display: flex; gap: 8px; align-items: center; }
.demo-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.btn {
  padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  border: 1px solid rgba(31,78,95,.12); background: #fff; color: var(--text); transition: .15s;
}
.btn:hover { border-color: var(--teal); color: var(--teal); }
.btn-accent { background: var(--coral); color: #fff; border-color: var(--coral); }
.btn-accent:hover { background: var(--coral-deep); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--teal-mid); font-weight: 600; }
.btn-ghost:hover { background: var(--teal-soft); }

.proj-select-wrap { position: relative; display: flex; align-items: center; border-radius: 999px; }
.proj-select {
  appearance: none; -webkit-appearance: none;
  padding: 9px 32px 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  border: none; background: transparent; color: var(--text-muted); font-family: inherit; cursor: pointer;
  max-width: 240px;
}
.view-tabs .proj-select-wrap.active { background: var(--teal); }
.view-tabs .proj-select-wrap.active .proj-select { color: #fff; }
.view-tabs .proj-select-wrap:not(.active):hover { background: var(--grey-soft); }
.proj-select-wrap::after {
  content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font-size: 11px; pointer-events: none; opacity: .7;
}
.view-tabs .proj-select-wrap.active::after { color: #fff; }

/* Bento */
.bento {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: var(--gap);
  align-items: stretch;
}
/* Section labels sit in the same grid — no extra margin so card gutters stay even */
.bento-label {
  grid-column: span 12;
  font-size: 17px; font-weight: 700; color: var(--teal);
  margin: 0; padding: 0; background: none; border: none; box-shadow: none;
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px;
}
.tile {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px 24px;
  border: 1px solid rgba(31,78,95,.04);
  display: flex; flex-direction: column; min-width: 0;
}
.tile.hero-coral { background: linear-gradient(145deg, #f09a7c, var(--coral)); color: #fff; border: none; }
.tile.hero-teal { background: linear-gradient(145deg, var(--teal-mid), var(--teal)); color: #fff; border: none; }
.tile.hero-coral .muted, .tile.hero-teal .muted { color: rgba(255,255,255,.78); }
.tile.span-2 { grid-column: span 2; }
.tile.span-3 { grid-column: span 3; }
.tile.span-4 { grid-column: span 4; }
.tile.span-5 { grid-column: span 5; }
.tile.span-6 { grid-column: span 6; }
.tile.span-7 { grid-column: span 7; }
.tile.span-8 { grid-column: span 8; }
.tile.span-12 { grid-column: span 12; }
.tile.row-2 { grid-row: span 2; }

.tile-label { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.tile.hero-coral .tile-label, .tile.hero-teal .tile-label { color: rgba(255,255,255,.85); }
.tile-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile.hero-coral .tile-title, .tile.hero-teal .tile-title { color: #fff; }
.kpi-num { font-size: 48px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; }
.kpi-num.lg { font-size: 56px; }
.kpi-num.sm { font-size: 36px; }
.kpi-meta { font-size: 14px; margin-top: 8px; color: var(--text-muted); }
.tile.hero-coral .kpi-meta, .tile.hero-teal .kpi-meta { color: rgba(255,255,255,.8); }
.muted { color: var(--text-muted); }
.see-all {
  margin-top: auto; padding-top: 14px;
  font-size: 13px; font-weight: 700; color: var(--teal-mid);
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
}
.tile.hero-coral .see-all, .tile.hero-teal .see-all { color: #fff; }
.see-all:hover { text-decoration: underline; }

/* Pills */
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--gap); }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: rgba(255,255,255,.8); border: 1px solid rgba(31,78,95,.08);
  color: var(--text-muted); cursor: pointer; transition: .15s; box-shadow: var(--shadow);
}
.pill:hover { border-color: var(--teal); color: var(--teal); }
.pill.active { background: var(--teal); color: #fff; border-color: var(--teal); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; }
.pill.active .dot { background: var(--coral); opacity: 1; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge-done { background: var(--green-soft); color: var(--green); }
.badge-active { background: var(--teal-soft); color: var(--teal); }
.badge-blocked { background: var(--red-soft); color: var(--red); }
.badge-pending { background: var(--grey-soft); color: var(--text-muted); }
.badge-amber { background: var(--amber-soft); color: var(--amber); }
.badge-cat { background: var(--purple-soft); color: var(--purple); }
.badge-maint { background: var(--green-soft); color: var(--green); }

/* Compact lists */
.compact-list { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.compact-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid rgba(31,78,95,.06); font-size: 14px;
}
.compact-row:last-child { border-bottom: none; }
.compact-row .main { font-weight: 600; line-height: 1.35; }
.compact-row .sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.compact-row.clickable { cursor: pointer; border-radius: 10px; margin: 0 -8px; padding: 10px 8px; }
.compact-row.clickable:hover { background: var(--surface-2); }

/* KPI strip — never thinner than readable */
.kpi-row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
}
.kpi-row > .tile { grid-column: auto; min-width: 0; }

/* Project cards — auto-fill so narrow viewports wrap instead of 1-char lines */
.proj-grid {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--gap);
}
.proj-mini {
  cursor: pointer; transition: .15s; position: relative; overflow: hidden;
  grid-column: auto !important; /* ignore span-* inside proj-grid */
}
.proj-mini:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.proj-mini .pname {
  font-size: 16px; font-weight: 700; margin: 8px 0 4px; line-height: 1.35;
  word-break: break-word; overflow-wrap: anywhere;
}
.proj-mini .pcode { font-size: 13px; color: var(--text-muted); }
.proj-mini .blocker-strip {
  margin-top: 12px; padding: 10px 12px; border-radius: 12px;
  background: var(--red-soft); color: var(--red); font-size: 13px; font-weight: 600;
}
.proj-mini .ok-strip {
  margin-top: 12px; padding: 10px 12px; border-radius: 12px;
  background: var(--green-soft); color: var(--green); font-size: 13px; font-weight: 600;
}
.mini-stepper { display: flex; gap: 4px; margin-top: 14px; }
.mini-step { flex: 1; height: 7px; border-radius: 4px; background: var(--grey-soft); }
.mini-step.done { background: var(--green); }
.mini-step.current { background: var(--coral); box-shadow: 0 0 0 3px rgba(238,138,106,.25); }
.mini-step.blocked { background: var(--red); }

/* Stage stepper */
.stage-section { margin-bottom: 0; }
.stage-stepper { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.stage-card {
  background: var(--surface-2); border-radius: 16px; padding: 14px;
  position: relative; transition: .2s; border: 2px solid transparent; min-height: 140px;
}
.stage-card.done { border-color: rgba(47,158,107,.25); background: #f0faf5; }
.stage-card.current {
  border-color: var(--coral); background: #fff;
  box-shadow: 0 0 0 4px rgba(238,138,106,.18), var(--shadow-lg);
}
.stage-card.blocked { border-color: rgba(201,68,68,.35); background: #fff8f8; }
.stage-card.pending { opacity: .75; }
.stage-num {
  width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; background: var(--grey-soft); color: var(--text-muted); margin-bottom: 8px;
}
.stage-card.done .stage-num { background: var(--green); color: #fff; }
.stage-card.current .stage-num { background: var(--coral); color: #fff; }
.stage-card.blocked .stage-num { background: var(--red); color: #fff; }
.current-badge {
  position: absolute; top: 10px; right: 10px; background: var(--coral); color: #fff;
  font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
}
.stage-name { font-size: 14px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
.sub-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.sub-item {
  display: flex; align-items: flex-start; gap: 6px; padding: 5px 6px; border-radius: 8px;
  font-size: 12px; cursor: pointer; transition: .1s; line-height: 1.35;
}
.sub-item:hover { background: rgba(238,138,106,.1); }
.sub-icon { flex-shrink: 0; width: 14px; height: 14px; margin-top: 1px; }
.loop-note { margin-top: 8px; font-size: 11px; color: var(--amber); background: var(--amber-soft); padding: 5px 8px; border-radius: 8px; line-height: 1.3; }

/* Project header */
.proj-header {
  background: var(--surface); border-radius: var(--radius); padding: 24px 28px;
  margin-bottom: var(--gap); box-shadow: var(--shadow);
}
.proj-header-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.back-link { font-size: 14px; color: var(--teal-mid); font-weight: 600; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 4px; }
.back-link:hover { text-decoration: underline; }
.ph-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--teal); letter-spacing: -.02em; }
.ph-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--text-muted); }
.ph-meta strong { color: var(--text); font-weight: 600; }
.ph-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.ph-stat { text-align: right; }
.ph-stat .sv { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.ph-stat .sl { font-size: 12px; color: var(--text-muted); font-weight: 600; }

/* Charts / gantt */
.gantt { font-size: 13px; }
.gantt-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; margin-bottom: 12px; align-items: center; }
.gantt-label { font-weight: 600; font-size: 13px; }
.gantt-track { position: relative; height: 40px; background: var(--surface-2); border-radius: 10px; }
.gantt-bar { position: absolute; height: 12px; border-radius: 6px; font-size: 9px; display: flex; align-items: center; padding: 0 6px; color: #fff; white-space: nowrap; overflow: hidden; }
.gantt-bar.planned { background: #a8c5d0; top: 6px; color: var(--teal); }
.gantt-bar.actual { background: var(--teal); top: 22px; }
.gantt-bar.actual.late { background: var(--coral); }
.gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--coral); z-index: 2; }
.gantt-today::after { content: "今日"; position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--coral); white-space: nowrap; }
.gantt-delay { font-size: 11px; color: var(--coral); font-weight: 700; margin-left: 6px; }
.gantt-legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
.gantt-legend span::before { content: ""; display: inline-block; width: 12px; height: 8px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
.leg-p::before { background: #a8c5d0; } .leg-a::before { background: var(--teal); } .leg-l::before { background: var(--coral); }
.chart-wrap { width: 100%; overflow: hidden; flex: 1; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.money { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
.delay-neg { color: var(--coral); } .delay-ok { color: var(--green); }
.bar-track { height: 10px; background: var(--grey-soft); border-radius: 6px; overflow: hidden; min-width: 60px; margin-top: 8px; }
.bar-fill { height: 100%; border-radius: 6px; background: var(--teal); }
.bar-fill.over { background: var(--coral); } .bar-fill.warn { background: var(--amber); }
.at-risk { color: var(--coral); font-weight: 700; }
.tick { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--grey-soft); color: var(--text-muted); }
.tick.yes { background: var(--green-soft); color: var(--green); }
.tick.no { background: var(--coral-soft); color: var(--coral); }

/* Inbox */
.inbox-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip {
  padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--grey-soft); color: var(--text-muted); border: 1px solid transparent;
}
.chip.active { background: var(--teal-soft); color: var(--teal); border-color: rgba(31,78,95,.15); }
.chip .cnt { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; background: rgba(0,0,0,.06); font-size: 11px; margin-left: 4px; }
.inbox-item {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid rgba(31,78,95,.06); cursor: pointer; align-items: start;
}
.inbox-item:hover { background: var(--surface-2); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 12px; }
.inbox-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: var(--grey-soft); }
.inbox-body .from { font-weight: 700; font-size: 14px; }
.inbox-body .text { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
.inbox-body .link-sub { font-size: 12px; color: var(--teal-mid); margin-top: 4px; font-weight: 600; }
.inbox-right { text-align: right; font-size: 12px; color: var(--text-light); }
.issue-group { margin-bottom: 14px; }
.issue-group h4 { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); }
.issue-card {
  border: 1px solid rgba(31,78,95,.06); border-radius: 12px; padding: 12px 14px; margin-bottom: 6px;
  font-size: 14px; display: flex; justify-content: space-between; gap: 10px; align-items: start; background: var(--surface-2);
}
.issue-card .age { color: var(--coral); font-weight: 700; white-space: nowrap; font-size: 13px; }

/* Drawer */
.overlay { position: fixed; inset: 0; background: rgba(26,43,51,.45); z-index: 100; display: none; align-items: stretch; justify-content: flex-end; }
.overlay.open { display: flex; }
.drawer {
  width: min(520px, 100%); background: var(--surface); box-shadow: -12px 0 40px rgba(0,0,0,.15);
  padding: 28px; overflow-y: auto; animation: slideIn .22s ease; border-radius: 24px 0 0 24px;
}
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-close { float: right; width: 36px; height: 36px; border-radius: 12px; font-size: 20px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
.drawer-close:hover { background: var(--grey-soft); }
.drawer h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; padding-right: 40px; color: var(--teal); }
.drawer-stage { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
.d-field { margin-bottom: 16px; }
.d-field .fl { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
.d-field .fv { font-size: 15px; }
.attach-list { list-style: none; }
.attach-list li { padding: 8px 10px; border-radius: 10px; background: var(--grey-soft); margin-bottom: 4px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.related-msg { padding: 10px; border: 1px solid rgba(31,78,95,.08); border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
.table-wrap { overflow-x: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid rgba(31,78,95,.08); white-space: nowrap; background: var(--surface-2); }
td { padding: 11px 12px; border-bottom: 1px solid rgba(31,78,95,.06); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
.hidden { display: none !important; }
.empty { color: var(--text-light); font-size: 14px; padding: 16px 0; text-align: center; }
.section-gap { margin-bottom: 0; } /* spacing comes from .bento gap only */
.donut-wrap { display: flex; align-items: center; gap: 16px; flex: 1; }
.donut-label { font-size: 14px; color: var(--text-muted); }
.donut-label strong { display: block; font-size: 22px; color: var(--text); margin-top: 2px; }

@media (max-width: 1100px) {
  .bento { grid-template-columns: repeat(6, 1fr); }
  .tile.span-2, .tile.span-3, .tile.span-4 { grid-column: span 3; }
  .tile.span-5, .tile.span-6, .tile.span-7, .tile.span-8 { grid-column: span 6; }
  .stage-stepper { grid-template-columns: repeat(3, 1fr); }
  .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .proj-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
}
@media (max-width: 700px) {
  .app { padding: 16px 14px 48px; }
  :root { --gap: 14px; }
  .bento { grid-template-columns: 1fr; }
  .tile.span-2, .tile.span-3, .tile.span-4, .tile.span-5,
  .tile.span-6, .tile.span-7, .tile.span-8, .tile.span-12 { grid-column: 1 / -1; }
  .tile.row-2 { grid-row: span 1; }
  .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-row > .tile { padding: 16px 14px; }
  .kpi-num, .kpi-num.lg { font-size: 36px; }
  .kpi-num.sm { font-size: 28px; }
  .proj-grid { grid-template-columns: 1fr; }

function findSub(project, subId) {

function renderCashflowChart(cf) {
  const w = 520, h = 180, pad = { t: 16, r: 16, b: 28, l: 44 };
  const months = cf.months || [];
  const planned = cf.planned;
  const actual = cf.actual.map(v => v == null ? null : v);
  const maxVal = Math.max(...planned.filter(Boolean), ...actual.filter(v => v != null), 1) * 1.1;
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const xAt = i => pad.l + (months.length <= 1 ? iw/2 : i / (months.length - 1) * iw);
  const yAt = v => pad.t + ih - (v / maxVal) * ih;
  const linePath = (arr) => {
    let d = "";
    arr.forEach((v, i) => {
      if (v == null) return;
      d += (d && arr[i-1]!=null ? "L" : "M") + xAt(i).toFixed(1) + "," + yAt(v).toFixed(1) + " ";
    });
    return d;
  };
  const labels = months.map((m,i) => `<text x="${xAt(i)}" y="${h-6}" text-anchor="middle" font-size="11" fill="#8aa0ad">${escapeHtml(m)}</text>`).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <path d="${linePath(planned)}" fill="none" stroke="#a8c5d0" stroke-width="3.5" stroke-dasharray="6 5" stroke-linecap="round"/>
    <path d="${linePath(actual)}" fill="none" stroke="#1F4E5F" stroke-width="4" stroke-linecap="round"/>
    ${actual.map((v,i) => v!=null ? `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="5" fill="#1F4E5F"/>` : "").join("")}
    ${labels}
  </svg>
  <div class="gantt-legend" style="margin-top:8px">
    <span class="leg-p">原定累計</span><span class="leg-a">實際已收／核證</span>
  </div></div>`;
}

function renderGantt(project) {
  const timeline = project.timeline;
  const allDates = timeline.flatMap(t => [t.plannedStart, t.plannedEnd, t.actualStart, t.actualEnd]).filter(Boolean);
  const minD = parseDate(allDates.reduce((a,b) => a < b ? a : b));
  const maxD = parseDate(allDates.reduce((a,b) => a > b ? a : b));
  const span = (maxD - minD) / 86400000 || 1;
  const today = parseDate(DATA.today);
  const pct = (d) => {
    if (!d) return null;
    const dt = parseDate(d);
    return Math.max(0, Math.min(100, ((dt - minD) / 86400000) / span * 100));
  };
  const todayPct = pct(DATA.today);
  const rows = timeline.map(t => {
    const sd = stageDef(t.stageId);
    const ps = pct(t.plannedStart), pe = pct(t.plannedEnd);
    const as_ = pct(t.actualStart);
    const ae = t.actualEnd ? pct(t.actualEnd) : (t.actualStart ? todayPct : null);
    let delayHtml = "";
    if (t.actualEnd && t.plannedEnd) {
      const delay = daysBetween(t.plannedEnd, t.actualEnd);
      if (delay > 0) delayHtml = `<span class="gantt-delay">+${delay}日</span>`;
    } else if (t.actualStart && !t.actualEnd && today > parseDate(t.plannedEnd)) {
      const delay = daysBetween(t.plannedEnd, DATA.today);
      delayHtml = `<span class="gantt-delay">延誤 ${delay}日</span>`;
    }
    const late = t.actualEnd ? daysBetween(t.plannedEnd, t.actualEnd) > 0 :
      (t.actualStart && today > parseDate(t.plannedEnd));
    return `
      <div class="gantt-row">
        <div class="gantt-label">${escapeHtml(sd.name)}${delayHtml}</div>
        <div class="gantt-track">
          <div class="gantt-today" style="left:${todayPct}%"></div>
          <div class="gantt-bar planned" style="left:${ps}%;width:${Math.max(1,pe-ps)}%"></div>
          ${as_ != null && ae != null ? `<div class="gantt-bar actual ${late?"late":""}" style="left:${as_}%;width:${Math.max(1,ae-as_)}%"></div>` : ""}
        </div>
      </div>`;
  }).join("");
  return `<div class="gantt-legend"><span class="leg-p">原定</span><span class="leg-a">實際</span><span class="leg-l">延誤</span></div><div class="gantt">${rows}</div>`;
}

  <div class="tile span-6">
    <div class="tile-title">判頭文件資料</div>
    <div class="kpi-meta" style="margin-bottom:8px">交俾判頭嘅文件齊備度</div>
    <div class="compact-list">
      ${DATA.projects.slice(0,3).map(p => {
        const docs = DATA.contractorDocs;
        const ok = docs.filter(d => p.contractorChecklist?.[d]).length;
        return `<div class="compact-row clickable" data-action="open-project" data-id="${p.id}">
          <div><div class="main">${escapeHtml(p.code)}</div><div class="sub">${ok}/${docs.length} 已交</div></div>
          <div class="bar-track" style="width:80px"><div class="bar-fill" style="width:${Math.round(ok/docs.length*100)}%"></div></div>
        </div>`;
      }).join("")}
    </div>
    <button class="see-all" data-action="drawer-table" data-table="docs">查看全部 →</button>
  </div>`;

  const budgetTile = `
  <div class="tile span-6">
    <div class="tile-title">Budget vs 工期</div>
    <div class="compact-list">
      ${DATA.projects.slice(0,3).map(p => {
        const rev = p.contractSum + p.voNet;
        const pct = rev ? Math.round(p.actualCost / rev * 100) : 0;
        return `<div class="compact-row clickable" data-action="open-project" data-id="${p.id}">
          <div><div class="main">${escapeHtml(p.code)}</div>
          <div class="sub">成本 ${pct}%　·　${p.daysDelayed>0?"+"+p.daysDelayed+"日":"準時"}</div></div>
          <div class="bar-track" style="width:80px"><div class="bar-fill ${pct>100?"over":pct>85?"warn":""}" style="width:${Math.min(100,pct)}%"></div></div>
        </div>`;
      }).join("")}
    </div>
    <button class="see-all" data-action="drawer-table" data-table="budget">查看全部 →</button>
  </div>`;

  return `
    ${pills}
    <div class="bento">
      ${hero}
      <div class="bento-label span-12">項目一覽 <span class="muted" style="font-weight:500;font-size:14px">點擊進入詳情</span></div>
      <div class="proj-grid">${projTiles}</div>
      ${deadlineTile}${issuesTile}${longLeadTile}${dscTile}${subTile}${docsTile}${budgetTile}
    </div>
  `;
}

function renderInbox(project) {
  const openIssues = getOpenIssues(project);
  const inbox = project.inbox || [];
  const counts = {
    all: inbox.length,
    "需我方處理": inbox.filter(i => i.category==="需我方處理").length,
    "需追他人": inbox.filter(i => i.category==="需追他人").length,
    "純資訊": inbox.filter(i => i.category==="純資訊").length,
    "已解決": inbox.filter(i => i.category==="已解決").length
  };
  const filtered = state.inboxFilter === "all" ? inbox : inbox.filter(i => i.category === state.inboxFilter);
  const shown = filtered.slice(0, 4);
  return `
  <div class="tile span-12">
    <div class="tile-title">
      <span>資訊 Inbox</span>
      <span>
        <button class="btn btn-sm ${state.inboxMode==="list"?"btn-accent":""}" data-action="inbox-mode" data-mode="list">訊息</button>
        <button class="btn btn-sm ${state.inboxMode==="issues"?"btn-accent":""}" data-action="inbox-mode" data-mode="issues">問題清單</button>
      </span>
    </div>
    ${state.inboxMode === "list" ? `
      <div class="inbox-tabs">
        ${["all","需我方處理","需追他人","純資訊","已解決"].map(f => `
          <button class="chip ${state.inboxFilter===f?"active":""}" data-action="inbox-filter" data-filter="${f}">
            ${f==="all"?"全部":f}<span class="cnt">${counts[f]}</span>
          </button>`).join("")}
      </div>
      ${shown.length ? shown.map(item => {
        const rel = item.relatedSub ? findSub(project, item.relatedSub) : null;
        return `
        <div class="inbox-item" data-action="${item.relatedSub?"open-drawer":""}" data-sub="${item.relatedSub||""}">
          <div class="inbox-icon">${sourceIcon(item.source)}</div>
          <div class="inbox-body">
            <div class="from">${escapeHtml(item.sender)} <span class="badge badge-pending" style="margin-left:4px">${escapeHtml(item.source)}</span></div>
            <div class="text">${escapeHtml(item.text)}</div>
            ${rel ? `<div class="link-sub">→ 關聯：${escapeHtml(rel.sub.name)}</div>` : ""}
          </div>
          <div class="inbox-right">
            <div class="time">${escapeHtml(item.time)}</div>
            ${item.category==="已解決"?statusBadge("done"):item.category==="需我方處理"?`<span class="badge badge-active">需我方處理</span>`:item.category==="需追他人"?`<span class="badge badge-blocked">需追他人</span>`:`<span class="badge badge-pending">純資訊</span>`}
          </div>
        </div>`;
      }).join("") : `<div class="empty">此分類暫無訊息</div>`}
      ${filtered.length > 4 ? `<button class="see-all" data-action="drawer-table" data-table="inbox">查看全部 ${filtered.length} 則 →</button>` : ""}
    ` : `
      ${["我方","判頭","客戶","政府部門","顧問"].map(party => {
        const items = openIssues.filter(i => i.party === party);
        if (!items.length) return "";
        return `<div class="issue-group"><h4>${escapeHtml(party)}（${items.length}）</h4>
          ${items.map(i => `
            <div class="issue-card" ${i.subId?`data-action="open-drawer" data-sub="${i.subId}"`:""}>
              <div><div style="font-weight:700">${escapeHtml(i.title)}</div></div>
              <div class="age">已等 ${i.daysWaiting} 日</div>
            </div>`).join("")}
        </div>`;
      }).join("") || `<div class="empty">暫無未解決問題</div>`}
    `}
  </div>`;
}

function renderProject(project) {
  const openIssues = getOpenIssues(project);
  const needUs = (project.inbox||[]).filter(i => i.category === "需我方處理").length;
  const needOthers = (project.inbox||[]).filter(i => i.category === "需追他人").length;
  const rev = project.contractSum + project.voNet;
  const budgetPct = rev ? Math.round(project.actualCost / rev * 100) : 0;

  const header = `
  <div class="proj-header">
    <button class="back-link" data-action="view-portfolio">← 返回總覽</button>
    <div class="proj-header-top">
      <div>
        <div class="ph-title">${escapeHtml(project.name)}</div>
        <div class="ph-meta">
          <span>編號 <strong>${escapeHtml(project.code)}</strong></span>
          <span>客戶 <strong>${escapeHtml(project.client)}</strong></span>
          <span>PIC <strong>${escapeHtml(project.pic)}</strong></span>
          <span>分類 <strong>${escapeHtml(project.category)}</strong></span>
          <span>合約 <strong>${fmtMoney(project.contractSum)}</strong></span>
          <span>VO <strong>${project.voNet>=0?"+":""}${fmtMoney(project.voNet)}</strong></span>
          <span>今日 <strong>${fmtDateHK(DATA.today)}</strong></span>
        </div>
      </div>
      <div class="ph-stats">
        <div class="ph-stat"><div class="sv" style="color:var(--teal)">${project.progress}%</div><div class="sl">整體進度</div></div>
        <div class="ph-stat"><div class="sv" style="color:var(--coral)">${openIssues.length}</div><div class="sl">未解決問題</div></div>
        <div class="ph-stat"><div class="sv" style="color:var(--amber)">${needOthers}</div><div class="sl">需追他人</div></div>
        <div class="ph-stat"><div class="sv" style="color:var(--teal-mid)">${needUs}</div><div class="sl">需我方處理</div></div>
      </div>
    </div>
  </div>`;

  const stages = `
  <div class="tile span-12 stage-section">
    <div class="tile-title">項目流程 <span class="muted" style="font-weight:500;font-size:14px">現階段由資料自動計算 · 點擊子項查看詳情</span></div>
    <div class="stage-stepper">
      ${project.stages.map((st, i) => {
        const def = stageDef(st.id);
        const status = getStageStatus(project, i);
        return `
        <div class="stage-card ${status}">
          ${status === "blocked" ? `<span class="current-badge" style="background:var(--red)">現階段</span>` : status === "current" ? `<span class="current-badge">現階段</span>` : ""}
          <div class="stage-num">${status==="done"?"✓":i+1}</div>
          <div class="stage-name">${escapeHtml(def.name)}</div>
          <ul class="sub-list">
            ${st.subs.map(sub => `
              <li class="sub-item" data-action="open-drawer" data-sub="${sub.id}">
                ${statusIcon(sub.status)}<span>${escapeHtml(sub.name)}</span>
              </li>`).join("")}
          </ul>
          ${def.loopNote ? `<div class="loop-note">↩ ${escapeHtml(def.loopNote)}</div>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>`;

  const ipcTotals = (project.ipcs||[]).reduce((a,r) => ({
    applied: a.applied + (r.applied||0),
    certified: a.certified + (r.certified||0),
    received: a.received + (r.received||0)
  }), {applied:0,certified:0,received:0});

  const timelineTile = `
  <div class="tile span-7">
    <div class="tile-title">工期 Timeline</div>
    <div style="display:flex;flex-wrap:wrap;gap:20px;margin-bottom:14px;font-size:14px">
      <div>原定完工：<strong>${fmtDateHK(project.plannedEnd)}</strong></div>
      <div>預測完工：<strong class="${project.daysDelayed>0?"delay-neg":""}">${fmtDateHK(project.forecastEnd)}${project.daysDelayed>0?"（+"+project.daysDelayed+"日）":""}</strong></div>
    </div>
    ${renderGantt(project)}
  </div>`;

  const cashTile = `
  <div class="tile span-5">
    <div class="tile-title">現金流</div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px;font-size:14px">
      <div>預算：<strong class="money">${fmtMoney(project.budget)}</strong></div>
      <div>實際成本：<strong class="money">${fmtMoney(project.actualCost)}</strong></div>
    </div>
    ${renderBudgetDonut(budgetPct)}
    <div style="margin-top:12px">${renderCashflowChart(project.cashflow)}</div>
  </div>`;

  const ipcTile = `
  <div class="tile span-12">
    <div class="tile-title">付款證書 IPC</div>
    <div class="table-wrap"><table>
      <thead><tr><th>編號</th><th>申請</th><th>核證</th><th>已收</th><th>狀態</th></tr></thead>
      <tbody>
        ${(project.ipcs||[]).length ? project.ipcs.map(r => `
          <tr>
            <td>${escapeHtml(r.no)}</td>
            <td class="money">${fmtMoneyShort(r.applied)}</td>
            <td class="money">${r.certified!=null?fmtMoneyShort(r.certified):"—"}</td>
            <td class="money">${fmtMoneyShort(r.received)}</td>
            <td>${statusBadge(r.status)}</td>
          </tr>`).join("") : `<tr><td colspan="5" class="empty">暫無 IPC</td></tr>`}
        ${(project.ipcs||[]).length ? `
          <tr style="font-weight:700;background:var(--surface-2)">
            <td>合計</td>
            <td class="money">${fmtMoneyShort(ipcTotals.applied)}</td>
            <td class="money">${fmtMoneyShort(ipcTotals.certified)}</td>
            <td class="money">${fmtMoneyShort(ipcTotals.received)}</td>
            <td></td>
          </tr>` : ""}
      </tbody>
    </table></div>
    ${project.retention ? `<div style="margin-top:12px;font-size:14px;color:var(--text-muted)">保留金合計：<strong>${fmtMoney(project.retention)}</strong></div>` : ""}
  </div>`;

  return `${header}<div class="bento">${stages}${renderInbox(project)}${timelineTile}${cashTile}${ipcTile}</div>`;
}

function openDrawer(subId) {
  const project = projectById(state.projectId);
  if (!project) return;
  const found = findSub(project, subId);
  if (!found) return;
  const { stage, sub } = found;
  const def = stageDef(stage.id);
  const relatedIssues = (project.issues||[]).filter(i => i.subId === subId || (sub.issues||[]).includes(i.id));
  const relatedInbox = (project.inbox||[]).filter(i => i.relatedSub === subId);
  state.drawerSubId = subId;
  document.getElementById("drawer").innerHTML = `
    <button class="drawer-close" data-action="close-drawer">×</button>
    <h2>${escapeHtml(sub.name)}</h2>
    <div class="drawer-stage">階段：${escapeHtml(def.name)}　·　${statusBadge(sub.status)}</div>
    <div class="d-field"><div class="fl">說明</div><div class="fv">${escapeHtml(sub.desc || "（無詳細說明）")}</div></div>
    <div class="d-field"><div class="fl">負責方</div><div class="fv">${escapeHtml(sub.owner)}</div></div>
    <div class="d-field"><div class="fl">到期日</div><div class="fv">${fmtDate(sub.due)}</div></div>
    <div class="d-field"><div class="fl">狀態</div><div class="fv">${statusBadge(sub.status)}</div></div>
    <div class="d-field"><div class="fl">關聯問題</div><div class="fv">
      ${relatedIssues.length ? relatedIssues.map(i => `
        <div class="related-msg"><strong>${escapeHtml(i.title)}</strong><br>負責：${escapeHtml(i.party)}　·　已等 ${i.daysWaiting} 日　·　${i.status==="open"?"未解決":"已解決"}</div>
      `).join("") : `<span style="color:var(--text-light)">無</span>`}
    </div></div>
    <div class="d-field"><div class="fl">相關 Inbox 訊息</div><div class="fv">
      ${relatedInbox.length ? relatedInbox.map(m => `
        <div class="related-msg">${sourceIcon(m.source)} <strong>${escapeHtml(m.sender)}</strong> · ${escapeHtml(m.time)}<br>${escapeHtml(m.text)}</div>
      `).join("") : `<span style="color:var(--text-light)">無</span>`}
    </div></div>
    <div class="d-field"><div class="fl">附件</div>
      <ul class="attach-list">
        ${(sub.attachments||[]).length ? sub.attachments.map(a => `<li>📎 ${escapeHtml(a)}</li>`).join("") : `<li style="color:var(--text-light)">無附件</li>`}
      </ul>
    </div>`;
  document.getElementById("overlay").classList.add("open");
}
function closeDrawer() {
  state.drawerSubId = null;
  document.getElementById("overlay").classList.remove("open");
}

function demoAdvance() {
  const project = projectById(state.projectId);
  if (!project) return;
  for (const st of project.stages) {
    for (const sub of st.subs) {
      if (sub.status !== "done") {
        sub.status = "done";
        if (sub.issues) {
          sub.issues.forEach(iid => {
            const iss = project.issues.find(x => x.id === iid);
            if (iss) iss.status = "resolved";
          });
        }
        render();
        return;
      }
    }
  }
}
function demoReset() {
  const snap = JSON.parse(JSON.stringify(DATA_SNAPSHOT));
  const idx = DATA.projects.findIndex(p => p.id === state.projectId);
  if (idx >= 0) DATA.projects[idx] = JSON.parse(JSON.stringify(snap.projects[idx]));
  render();
}

function render() {
  const app = document.getElementById("app");
  let body = "";
  if (state.view === "portfolio") {
    body = renderPortfolio();
  } else {
    const p = projectById(state.projectId) || DATA.projects[0];
    state.projectId = p.id;
    body = renderProject(p);
  }
  app.innerHTML = renderTopbar() + `<div class="view-panel">${body}</div>`;
  if (state.drawerSubId && state.view === "project") openDrawer(state.drawerSubId);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) {
    if (e.target.id === "overlay") closeDrawer();
    return;
  }
  const action = t.dataset.action;
  if (action === "view-portfolio") {
    state.view = "portfolio"; state.projectId = null;
    state.inboxFilter = "all"; state.inboxMode = "list";
    closeDrawer(); render();
  } else if (action === "open-project") {
    state.projectId = t.dataset.id; state.view = "project";
    state.inboxFilter = "all"; state.inboxMode = "list";
    closeDrawer(); render(); window.scrollTo(0, 0);
  } else if (action === "open-drawer") {
    if (t.dataset.sub) openDrawer(t.dataset.sub);
  } else if (action === "close-drawer") {
    closeDrawer();
  } else if (action === "demo-advance") {
    demoAdvance();
  } else if (action === "demo-reset") {
    demoReset();
  } else if (action === "inbox-filter") {
    state.inboxFilter = t.dataset.filter; render();
  } else if (action === "inbox-mode") {
    state.inboxMode = t.dataset.mode; render();
  } else if (action === "filter-cat") {
    state.filterCat = t.dataset.cat; render();
  } else if (action === "drawer-table") {
    const kind = t.dataset.table;
    const allIssues = DATA.projects.flatMap(p => getOpenIssues(p).map(i => ({...i, projectId: p.id, projectCode: p.code})));
    const allDeadlines = DATA.projects.flatMap(p => (p.deadlines||[]).map(d => ({...d, projectCode: p.code}))).sort((a,b) => a.date.localeCompare(b.date));
    if (kind === "longlead") openTableDrawer("貨期 Long Lead Items", fullTableLongLead());
    else if (kind === "dsc") openTableDrawer("DSC 指定分包商", fullTableDsc());
    else if (kind === "subs") openTableDrawer("呈交文件摘要", fullTableSubs());
    else if (kind === "docs") openTableDrawer("交俾判頭嘅文件／資料", fullTableDocs());
    else if (kind === "budget") openTableDrawer("Budget vs Actual ／ 工期", fullTableBudget());
    else if (kind === "deadlines") openTableDrawer("逾期及即將到期", fullTableDeadlines(allDeadlines));
    else if (kind === "issues") openTableDrawer("跨項目問題清單", fullTableIssues(allIssues));
    else if (kind === "inbox") {
      const project = projectById(state.projectId);
      const inbox = project ? (project.inbox || []) : [];
      const filtered = state.inboxFilter === "all" ? inbox : inbox.filter(i => i.category === state.inboxFilter);
      const html = filtered.map(item => `
        <div class="inbox-item" data-action="${item.relatedSub?"open-drawer":""}" data-sub="${item.relatedSub||""}">
          <div class="inbox-icon">${sourceIcon(item.source)}</div>
          <div class="inbox-body">
            <div class="from">${escapeHtml(item.sender)}</div>
            <div class="text">${escapeHtml(item.text)}</div>
          </div>
          <div class="inbox-right"><div class="time">${escapeHtml(item.time)}</div></div>
        </div>`).join("") || `<div class="empty">暫無</div>`;
      openTableDrawer("資訊 Inbox", html);
    }
  }
});

document.addEventListener("change", (e) => {
  const t = e.target.closest("[data-action='select-project']");
  if (!t) return;
  const id = t.value;
  if (!id) return;
  state.projectId = id;
  state.view = "project";
  state.inboxFilter = "all";
  state.inboxMode = "list";
  closeDrawer();
  render();
  window.scrollTo(0, 0);
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

render();

</script>
</body>
</html>
