<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東信行 — 工程項目管理總覽</title>
</head>
<body>
<!-- ver-2026-10-06d-relative-dates SELECT_PROJECT_DROPDOWN -->
<script>
(async function () {
  const origin = location.href.replace(/[^/]*$/, '');
  const files = ['d0.b64', 'd1.b64', 'd2.b64', 'd3.b64', 'd4.b64', 'd5.b64', 'd6.b64', 'd7.b64', 'd8.b64', 'd9.b64', 'd10.b64', 'd11.b64'];
  const texts = await Promise.all(files.map(async f => {
    const r = await fetch(origin + f);
    if (!r.ok) throw new Error(f + ' HTTP ' + r.status);
    return (await r.text()).trim();
  }));
  const b64 = texts.join('');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();
  document.write(html);
  document.close();
})().catch(err => {
  document.body.innerHTML = '<pre style="padding:24px;font:14px/1.4 monospace;color:#b91c1c">載入失敗: ' + String(err) + '</pre>';
});
</script>
</body>
</html>
