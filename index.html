<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東信行 — 工程項目管理總覽</title>
</head>
<body>
<!-- Dummy demo dashboard: 工程項目管理 -->
<script>
(async function () {
  const files = ['p0.b64', 'p1.b64', 'p2.b64', 'p3.b64', 'p4.b64', 'p5.b64'];
  const texts = await Promise.all(files.map(async function (f) {
    const r = await fetch(new URL(f, location.href));
    if (!r.ok) throw new Error(f + ' HTTP ' + r.status);
    return (await r.text()).trim();
  }));
  const b64 = texts.join('');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(function (err) {
  document.body.textContent = 'Failed to load dashboard: ' + err;
});
</script>
<noscript>工程項目管理 — JavaScript required</noscript>
</body>
</html>
