<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東信行 — 工程項目管理總覽</title>
</head>
<body>
<!-- ver-2026-10-06-relative-dates SELECT_PROJECT_DROPDOWN -->
<script>
(async function () {
  const origin = location.href.replace(/[^/]*$/, '');
  const r = await fetch(origin + 'p0.b64');
  if (!r.ok) throw new Error('p0.b64 HTTP ' + r.status);
  const b64 = (await r.text()).trim();
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const html = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
})().catch(function (err) {
  document.body.textContent = 'Failed to load dashboard: ' + err;
});
</script>
<noscript>工程項目管理 — JavaScript required</noscript>
</body>
</html>
